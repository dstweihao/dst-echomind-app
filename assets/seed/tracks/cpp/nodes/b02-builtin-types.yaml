id: "b02-builtin-types"
title: "基本类型"
progress_range: [2, 4]
phase: 1
phase_name: "C++ 基础"
order: 2
description: >
  类型决定了数据的位宽与运算规则。这一关只讲最常用的基本内置类型及其常见初学陷阱。
core_concepts:
  - "基本类型决定存储空间与除法行为：整型除法自动截断小数，浮点型除法保留精度"
socratic_questions:
  - id: Q0_char_signedness
    level: "类型与运算"
    text: "若写 double result = 5 / 2; 得到的结果为什么是 2.0 而不是 2.5，怎样修改才能正确得到 2.5？"
interception:
  minimum_pass_line: "能指出 5 和 2 都是 int，整数除法先执行截断为 2 后才转为 double，需至少一个操作数为浮点数"
  on_failure: "AI 列出整型除法截断与类型转换的对比说明，通过后回归本节点"
acceptance_criteria:
  - "能熟练选用 int、double、bool、char 等基本类型并规避整型除法精度丢失陷阱"
next_node: "b03-variable-init"
prerequisites: ["f01-program"]
