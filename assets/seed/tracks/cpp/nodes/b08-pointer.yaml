id: "b08-pointer"
title: "指针"
progress_range: [16, 18]
phase: 1
phase_name: "C++ 基础"
order: 9
description: >
  指针保存变量的内存地址。这一关只讲取地址运算符、解引用访问以及判空安全性。
core_concepts:
  - "指针存储的是变量的内存地址，使用 * 访问所指内容前必须确保其指向有效地址且非 nullptr"
socratic_questions:
  - id: Q0_nullptr_deref
    level: "指针基础"
    text: "如果写了 int a = 10; int* p = &a; 那么 p 和 *p 分别代表什么？为什么对 nullptr 进行 *p 赋值会导致程序直接崩溃？"
interception:
  minimum_pass_line: "能说出 p 保存地址，*p 访问该地址对应的数据，nullptr 不指向任何合法内存，解引用会导致非法内存访问崩溃"
  on_failure: "AI 展示指针地址与对应内存格子的物理对应图，通过后回归本节点"
acceptance_criteria:
  - "能准确运用取地址符 & 与解引用符 * 读写变量，并在解引用前进行非空校验"
next_node: "b09-reference"
prerequisites: ["b07-parameter-passing"]
