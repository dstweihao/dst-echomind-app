id: "b14-destructor"
title: "析构函数"
progress_range: [30, 32]
phase: 1
phase_name: "C++ 基础"
order: 16
description: >
  析构函数在对象离开作用域生命终结时自动触发。这一关只讲确定性析构与资源自动清理机制。
core_concepts:
  - "局部对象在离开花括号作用域时自动调用析构函数，保证持有的资源能被确定性自动释放"
socratic_questions:
  - id: Q0_dtor_trigger
    level: "确定性析构"
    text: "在局部代码块 { MyResource obj; } 中，当执行流程跨出右花括号 } 的瞬间，obj 发生了什么？"
interception:
  minimum_pass_line: "能说出离开作用域时局部对象的析构函数会自动触发，无需手动清理即可收回资源"
  on_failure: "AI 演示函数返回时栈上局部对象逐个自动触发析构的时序图，通过后回归本节点"
acceptance_criteria:
  - "能熟练编写自定义析构函数并准确理解局部对象出作用域自动清理的生命周期机制"
next_node: "00-memory-model"
prerequisites: ["b13-constructor"]
