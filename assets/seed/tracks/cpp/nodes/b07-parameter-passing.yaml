id: "b07-parameter-passing"
title: "参数传递"
progress_range: [14, 16]
phase: 1
phase_name: "C++ 基础"
order: 8
description: >
  按值传递会为形参创建独立副本。这一关只讲值传递无法修改外部实参的物理本质。
core_concepts:
  - "函数按值传递时形参只是实参的一份拷贝，在函数内对形参的任何修改都不会影响外部变量"
socratic_questions:
  - id: Q0_pass_by_value
    level: "传参机制"
    text: "写一个 void addTen(int x) { x += 10; }，调用 addTen(num) 后外部的 num 为什么没有变大？"
interception:
  minimum_pass_line: "能说出形参 x 是实参 num 的独立副本，函数内操作的是局部拷贝，无法影响外部实参"
  on_failure: "AI 画出函数调用时栈帧上实参与形参各自独立的内存图，通过后回归本节点"
acceptance_criteria:
  - "能透彻解释值传递创建独立副本的机制，并能指出为何需要其他传参方式来修改外部数据"
next_node: "b08-pointer"
prerequisites: ["b06-function"]
