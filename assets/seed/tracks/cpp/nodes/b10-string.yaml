id: "b10-string"
title: "字符串"
progress_range: [22, 24]
phase: 1
phase_name: "C++ 基础"
order: 12
description: >
  std::string 是现代 C++ 处理文本的标准容器。这一关只讲自动内存管理与基础字符串操作。
core_concepts:
  - "std::string 自动管理字符存储空间并支持动态变长，从根本上杜绝了固定数组的缓冲区溢出"
socratic_questions:
  - id: Q0_string_inval
    level: "字符串基础"
    text: "相比于 C 风格的 char arr[10]，使用 std::string 进行字符串拼接（如 s += '...'）在安全性和便利性上有何本质优势？"
interception:
  minimum_pass_line: "能指出 std::string 会根据需要自动调整内存大小，而固定 char 数组超长会发生缓冲区溢出破坏内存"
  on_failure: "AI 演示字符数组越界与 std::string 自动扩容的对比，通过后回归本节点"
acceptance_criteria:
  - "能熟练使用 std::string 完成文本初始化、拼接和长度获取等基础操作"
next_node: "b11-vector"
prerequisites: ["f03-const"]
