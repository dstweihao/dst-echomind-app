name: echomind_app
description: 回响 (EchoMind) - 基于 DeepSeek 对话与语音能力的苏格拉底式学习应用
publish_to: 'none'
version: 1.0.6+7

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^3.4.3

  # 路由
  go_router: ^18.0.2

  # 网络
  http: ^1.6.0

  # 数据格式：Markdown + YAML 配置
  yaml: ^3.1.4

  # 本地存储：凭证加密 + UI 偏好 + 本地路径
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  path: ^1.9.0

  # 工具
  uuid: ^4.6.0
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2
  file_selector: ^1.1.0
  image_picker: ^1.1.2
  pasteboard: ^0.6.1
  share_plus: ^13.3.1
  flutter_markdown: ^0.7.7+1
  record: ^7.2.0
  flutter_soloud: ^5.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4
  # 测试里替掉插件通道（临时目录 / 拉起文件），不引入运行时依赖
  path_provider_platform_interface: ^2.1.2
  url_launcher_platform_interface: ^2.3.2

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#2563EB"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/icon.png"
  web:
    generate: false